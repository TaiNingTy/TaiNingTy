<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 749" width="400" height="749" role="img" aria-label="技术规格">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .a { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); }
                    to   { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .a { animation: none; } }</style>
<text x="0" y="36" font-size="28" font-weight="700" letter-spacing="-.6" fill="#1d1d1f">技术规格</text>
<line x1="0" x2="400" y1="58" y2="58" stroke="#1d1d1f" stroke-width="1.5"/>
<g class="a" style="animation-delay:0.15s"><text x="0" y="114" font-size="15" font-weight="600" fill="#6e6e73">型号</text></g>
<g class="a" style="animation-delay:0.15s"><text x="0" y="141" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Tai Ning</tspan></text><text x="0" y="168" font-size="18" fill="#1d1d1f"><tspan font-weight="400">AI 产品经理</tspan></text></g>
<line x1="0" x2="400" y1="188" y2="188" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.27s"><text x="0" y="225" font-size="15" font-weight="600" fill="#6e6e73">核心功能</text></g>
<g class="a" style="animation-delay:0.27s"><text x="0" y="252" font-size="18" fill="#1d1d1f"><tspan font-weight="400">把零散的领域经验，</tspan></text><text x="0" y="279" font-size="18" fill="#1d1d1f"><tspan font-weight="400">转化为可落地的规则、数据和智能体。</tspan></text></g>
<line x1="0" x2="400" y1="299" y2="299" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.39s"><text x="0" y="337" font-size="15" font-weight="600" fill="#6e6e73">安全</text></g>
<g class="a" style="animation-delay:0.39s"><text x="0" y="364" font-size="18" fill="#1d1d1f"><tspan font-weight="400">默认人在回路。</tspan></text><text x="0" y="391" font-size="18" fill="#1d1d1f"><tspan font-weight="400">知道 AI 何时该交给人。</tspan></text></g>
<line x1="0" x2="400" y1="411" y2="411" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.51s"><text x="0" y="449" font-size="15" font-weight="600" fill="#6e6e73">已发布</text></g>
<g class="a" style="animation-delay:0.51s"><text x="0" y="476" font-size="18" fill="#1d1d1f"><tspan font-weight="600">AI Station Configuration</tspan></text><text x="0" y="503" font-size="18" fill="#1d1d1f"><tspan font-weight="400">人工把关的智能体</tspan></text><text x="0" y="530" font-size="18" fill="#1d1d1f"><tspan font-weight="600">Station Decision Support V2</tspan></text><text x="0" y="557" font-size="18" fill="#1d1d1f"><tspan font-weight="400">进行中</tspan></text></g>
<line x1="0" x2="400" y1="576" y2="576" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.63s"><text x="0" y="614" font-size="15" font-weight="600" fill="#6e6e73">教育</text></g>
<g class="a" style="animation-delay:0.63s"><text x="0" y="641" font-size="18" fill="#1d1d1f"><tspan font-weight="400">哥伦比亚大学</tspan></text></g>
<line x1="0" x2="400" y1="661" y2="661" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.75s"><text x="0" y="699" font-size="15" font-weight="600" fill="#6e6e73">兼容</text></g>
<g class="a" style="animation-delay:0.75s"><text x="0" y="726" font-size="18" fill="#1d1d1f"><tspan font-weight="400">工程师 · 设计师 · 领域专家</tspan></text></g>
<line x1="0" x2="400" y1="746" y2="746" stroke="#d2d2d7" stroke-width="1"/>
</svg>
