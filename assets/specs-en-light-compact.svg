<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 749" width="400" height="749" role="img" aria-label="Tech Specs">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .a { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); }
                    to   { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .a { animation: none; } }</style>
<text x="0" y="36" font-size="28" font-weight="700" letter-spacing="-.6" fill="#1d1d1f">Tech Specs</text>
<line x1="0" x2="400" y1="58" y2="58" stroke="#1d1d1f" stroke-width="1.5"/>
<g class="a" style="animation-delay:0.15s"><text x="0" y="114" font-size="15" font-weight="600" fill="#6e6e73">Model</text></g>
<g class="a" style="animation-delay:0.15s"><text x="0" y="141" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Tai Ning</tspan></text><text x="0" y="168" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Product Manager, AI</tspan></text></g>
<line x1="0" x2="400" y1="188" y2="188" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.27s"><text x="0" y="225" font-size="15" font-weight="600" fill="#6e6e73">Core Feature</text></g>
<g class="a" style="animation-delay:0.27s"><text x="0" y="252" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Turns messy domain expertise into</tspan></text><text x="0" y="279" font-size="18" fill="#1d1d1f"><tspan font-weight="400">rules, data and agents that ship.</tspan></text></g>
<line x1="0" x2="400" y1="299" y2="299" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.39s"><text x="0" y="337" font-size="15" font-weight="600" fill="#6e6e73">Safety</text></g>
<g class="a" style="animation-delay:0.39s"><text x="0" y="364" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Human-in-the-loop by default.</tspan></text><text x="0" y="391" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Knows when AI should defer.</tspan></text></g>
<line x1="0" x2="400" y1="411" y2="411" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.51s"><text x="0" y="449" font-size="15" font-weight="600" fill="#6e6e73">Shipped</text></g>
<g class="a" style="animation-delay:0.51s"><text x="0" y="476" font-size="18" fill="#1d1d1f"><tspan font-weight="600">AI Station Configuration</tspan></text><text x="0" y="503" font-size="18" fill="#1d1d1f"><tspan font-weight="400">human-gated agents</tspan></text><text x="0" y="530" font-size="18" fill="#1d1d1f"><tspan font-weight="600">Station Decision Support V2</tspan></text><text x="0" y="557" font-size="18" fill="#1d1d1f"><tspan font-weight="400">in progress</tspan></text></g>
<line x1="0" x2="400" y1="576" y2="576" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.63s"><text x="0" y="614" font-size="15" font-weight="600" fill="#6e6e73">Education</text></g>
<g class="a" style="animation-delay:0.63s"><text x="0" y="641" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Columbia University</tspan></text></g>
<line x1="0" x2="400" y1="661" y2="661" stroke="#d2d2d7" stroke-width="1"/>
<g class="a" style="animation-delay:0.75s"><text x="0" y="699" font-size="15" font-weight="600" fill="#6e6e73">Compatibility</text></g>
<g class="a" style="animation-delay:0.75s"><text x="0" y="726" font-size="18" fill="#1d1d1f"><tspan font-weight="400">Engineers · Designers · Domain experts</tspan></text></g>
<line x1="0" x2="400" y1="746" y2="746" stroke="#d2d2d7" stroke-width="1"/>
</svg>
