<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 261" width="400" height="261" role="img" aria-label="AI Station Configuration: A multi-agent system that configures autonomous-transit stations, and knows when to defer to a human.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .a { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); }
                    to   { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .a { animation: none; } }</style>
<rect width="400" height="261" rx="22" fill="#f5f5f7"/>
<text x="24" y="40" text-anchor="start" font-size="12" font-weight="600" letter-spacing="2" fill="#6e6e73">CASE STUDY 01</text>
<text x="24" y="80" font-size="26" font-weight="600" letter-spacing="-.5" fill="#1d1d1f">AI Station</text>
<text x="24" y="112" font-size="26" font-weight="600" letter-spacing="-.5" fill="#1d1d1f">Configuration</text>
<text x="24" y="152" font-size="18" fill="#6e6e73">A multi-agent system that configures</text>
<text x="24" y="177" font-size="18" fill="#6e6e73">autonomous-transit stations, and</text>
<text x="24" y="202" font-size="18" fill="#6e6e73">knows when to defer to a human.</text>
<text x="24" y="240" font-size="18" fill="#0066cc">Read the case study ›</text>
</svg>
