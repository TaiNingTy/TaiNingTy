<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 629" width="800" height="629" role="img" aria-label="Tech Specs">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .a { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); }
                    to   { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .a { animation: none; } }</style>
<text x="0" y="48" font-size="34" font-weight="700" letter-spacing="-.6" fill="#f5f5f7">Tech Specs</text>
<line x1="0" x2="800" y1="74" y2="74" stroke="#f5f5f7" stroke-width="1.5"/>
<g class="a" style="animation-delay:0.15s"><text x="0" y="140" font-size="20" font-weight="600" fill="#f5f5f7">Model</text><text x="230" y="140" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Tai Ning</tspan></text><text x="230" y="172" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Product Manager, AI</tspan></text></g>
<line x1="0" x2="800" y1="195" y2="195" stroke="#424245" stroke-width="1"/>
<g class="a" style="animation-delay:0.27s"><text x="0" y="239" font-size="20" font-weight="600" fill="#f5f5f7">Core Feature</text><text x="230" y="239" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Turns messy domain expertise into</tspan></text><text x="230" y="270" font-size="21" fill="#f5f5f7"><tspan font-weight="400">rules, data and agents that ship.</tspan></text></g>
<line x1="0" x2="800" y1="293" y2="293" stroke="#424245" stroke-width="1"/>
<g class="a" style="animation-delay:0.39s"><text x="0" y="338" font-size="20" font-weight="600" fill="#f5f5f7">Safety</text><text x="230" y="338" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Human-in-the-loop by default.</tspan></text><text x="230" y="369" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Knows when AI should defer.</tspan></text></g>
<line x1="0" x2="800" y1="392" y2="392" stroke="#424245" stroke-width="1"/>
<g class="a" style="animation-delay:0.51s"><text x="0" y="436" font-size="20" font-weight="600" fill="#f5f5f7">Shipped</text><text x="230" y="436" font-size="21" fill="#f5f5f7"><tspan font-weight="600">AI Station Configuration</tspan><tspan font-weight="400"> — human-gated agents</tspan></text><text x="230" y="468" font-size="21" fill="#f5f5f7"><tspan font-weight="600">Station Decision Support V2</tspan><tspan font-weight="400"> — in progress</tspan></text></g>
<line x1="0" x2="800" y1="491" y2="491" stroke="#424245" stroke-width="1"/>
<g class="a" style="animation-delay:0.63s"><text x="0" y="535" font-size="20" font-weight="600" fill="#f5f5f7">Education</text><text x="230" y="535" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Columbia University</tspan></text></g>
<line x1="0" x2="800" y1="558" y2="558" stroke="#424245" stroke-width="1"/>
<g class="a" style="animation-delay:0.75s"><text x="0" y="602" font-size="20" font-weight="600" fill="#f5f5f7">Compatibility</text><text x="230" y="602" font-size="21" fill="#f5f5f7"><tspan font-weight="400">Engineers · Designers · Domain experts</tspan></text></g>
<line x1="0" x2="800" y1="625" y2="625" stroke="#424245" stroke-width="1"/>
</svg>
